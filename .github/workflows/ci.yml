name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - run: npm ci
      - run: npm run lint
      - run: npm run check:no-dotenvx
      - run: npm test
      - run: npm run build
      - run: npm run package:vsix

      - uses: actions/upload-artifact@v4
        with:
          name: env-handler-vsix
          path: dist/*.vsix
